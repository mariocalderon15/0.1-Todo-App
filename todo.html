<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./src/style-app.css">
  
  <title>Todo App</title>
</head>

<body>
  <section class="todoapp">
    <header class="header">
      <h1>Tareas</h1>
      <input id="new-todo-input" name="todo" type="text" class="new-todo"
        placeholder="¿Qué necesita ser hecho?" autofocus>
    </header>

    <input id="toggle-all" class="toggle-all" type="checkbox">
    <label for="toggle-all">Mark all as complete</label>
    <ul class="todo-list"></ul>

    <footer class="footer">
      <span class="todo-count"><strong id="pending-count">0</strong> pendiente(s)</span>
      <ul class="filters">
        <li><a class="filtro selected" href="#/">Todos</a></li>
        <li><a class="filtro" href="#/active">Pendientes</a></li>
        <li><a class="filtro" href="#/completed">Completados</a></li>
      </ul>
      <button class="btn btn-primary clear-completed">Borrar completados</button>
    </footer>
  </section>

  <button id="logout-btn" class="btn btn-danger logout-btn mt-3">Cerrar sesión</button>

  <script type="module" src="./src/main-app.js"></script>
</body>

</html>
