<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script type="module" src="src/todos/app.html"></script> 
   <title>Login - Todo App</title>
   <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      padding: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    form {
      display: flex;
      flex-direction: column;
      width: 300px;
    }
    input{
      padding: 5px;
      margin: 5px 0;
      font-size: 16px;
    }
    button{
      padding: 10px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }
    button:hover{
      background-color: #0056b3;
    }
   </style>
  </head>
  <body>
    <div id="login-conteiner">
      <h2>Iniciar sesion</h2>
      <form id="login-form">
        <label for="username">Usuario:</label>
        <input type="text" id="usurname" placeholder="Usuario" required />
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña" required />
        <button type="submit">Iniciar sesion</button>
      </form>
      <div id="error-message" style="display: none; color: red;">Usuario o contraseña incorrectas</div>
    </div>

    <div id="app"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
