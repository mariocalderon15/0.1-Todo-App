<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <title>Login - Todo App</title>

  <script type="module" crossorigin src="/0.1-Todo-App/assets/index-BilR0Byu.js"></script>
  <link rel="stylesheet" crossorigin href="/0.1-Todo-App/assets/index-DHm7Aet7.css">
</head>

<body>
  <div id="login-conteiner">
    <h2>Iniciar sesion</h2>
    <form id="login-form">
      <label class="username" for="username">Usuario:</label>
      <input type="text" id="username" placeholder="Usuario" autocomplete="username" required />
      <label class="password" for="password">Contraseña</label>

      <div class="input-group password-group">
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required />
        
        <button class="eye-btn" type="button" id="togglePassword">
          <i class="bi bi-eye"></i>
        </button>
      
      </div>

      <button class="btn-submit" type="submit">Iniciar sesion</button>
    </form>
  </div>
</body>

</html>
